<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="84" viewBox="0 0 1000 84" role="img" aria-label="Proyectos" font-family="'OS','Open Sans','Segoe UI',system-ui,sans-serif"><title>Proyectos</title><style>@font-face{font-family:'OS';font-weight:400;src:url(data:font/woff2;base64,)}@font-face{font-family:'OS';font-weight:600;src:url(data:font/woff2;base64,)}
.bl{animation:bl .75s linear infinite}.bl1{opacity:0;animation-delay:.25s}.bl2{opacity:0;animation-delay:.5s}
@keyframes bl{0%,33%{opacity:1}34%,100%{opacity:0}}
.reel{animation:reel 2.4s linear infinite}@keyframes reel{to{transform:rotate(360deg)}}
.nt{opacity:0;animation:nt 3.2s ease-out infinite}.nt1{animation-delay:1.1s}.nt2{animation-delay:2.2s}
@keyframes nt{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(-16px,-40px)}}
.sw{animation:sw 4s ease-in-out infinite}@keyframes sw{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.8deg)}}
.stm{opacity:0;animation:stm 3s ease-in-out infinite}.stm1{animation-delay:1s}.stm2{animation-delay:2s}
@keyframes stm{0%{opacity:0;transform:translateY(6px)}30%{opacity:.85}100%{opacity:0;transform:translateY(-28px)}}
.scan{animation:scan 3.5s linear infinite}@keyframes scan{0%{transform:translateY(-30px)}100%{transform:translateY(240px)}}
.spin{animation:spin 16s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.bnc{animation:bnc 3s ease-in-out infinite}@keyframes bnc{0%,70%,100%{transform:translateY(0)}78%{transform:translateY(-8px)}86%{transform:translateY(0)}92%{transform:translateY(-3px)}}
.flag{animation:flag 5s ease-in-out infinite}@keyframes flag{0%,40%{transform:rotate(0)}50%,90%{transform:rotate(-75deg)}100%{transform:rotate(0)}}
.walk{animation:walk 14s linear infinite}@keyframes walk{from{transform:translateX(-90px)}to{transform:translateX(600px)}}
.lgA{animation:lg .45s ease-in-out infinite alternate}.lgB{animation:lg .45s ease-in-out infinite alternate-reverse}
@keyframes lg{from{transform:rotate(-11deg)}to{transform:rotate(11deg)}}
.env{animation:env 5s ease-in-out infinite}@keyframes env{0%,35%{transform:translateY(14px)}50%,85%{transform:translateY(-6px)}100%{transform:translateY(14px)}}
.ltr{animation:ltr 5s ease-in-out infinite}@keyframes ltr{0%,40%{transform:translateX(0)}50%,90%{transform:translateX(18px)}100%{transform:translateX(0)}}
